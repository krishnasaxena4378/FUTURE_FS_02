# Render Blueprint: creates the web service and a persistent disk for the SQLite file.
services:
  - type: web
    name: lead-manager
    runtime: python
    plan: starter            # paid plan (needed for a persistent disk)
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT
    disk:
      name: lead-data
      mountPath: /var/data   # anything saved here survives restarts and redeploys
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/leads.db
      - key: SECRET_KEY
        generateValue: true
